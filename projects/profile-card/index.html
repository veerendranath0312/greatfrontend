<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Profile card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" href="img/favicon.ico" sizes="any" />
  </head>
  <body>
    <div class="card">
      <div class="card-details">
        <img
          class="card-details__image"
          src="./img/profile.png"
          alt="Sarah profile image"
        />
        <div>
          <h3 class="card-details__name">Sarah Dole</h3>
          <p class="card-details__role">Front End Engineer @ Microsoft</p>
        </div>
        <p class="card-details__bio">
          I turn coffee into bugs which are fixed by someone else. Certified Stack
          Overflow and ChatGPT developer.
        </p>
      </div>
      <div class="card-social-links">
        <button class="card-social-links__btn">Contact me</button>
        <div class="card-social-icons">
          <ion-icon name="logo-github"></ion-icon>
          <ion-icon name="logo-linkedin"></ion-icon>
          <ion-icon name="logo-instagram"></ion-icon>
          <ion-icon name="logo-x"></ion-icon>
        </div>
      </div>
    </div>

    <div class="credits" data-gfe-screenshot-exclude="true">
      A challenge by
      <a href="https://www.greatfrontend.com/projects?ref=challenges" target="_blank"
        >GreatFrontEnd Projects</a
      >. Built by
      <a href="https://www.greatfrontend.com/projects/u/veerendranath" target="_blank"
        >Veerendranath</a
      >.
    </div>
    <script src="js/index.js"></script>

    <!-- ionicons -->
    <script
      type="module"
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"
    ></script>
  </body>
</html>
